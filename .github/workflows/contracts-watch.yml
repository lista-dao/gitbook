name: Contract Address Watch

# Syncs contract ADDRESSES from Notion -> the GitBook contract pages and opens a
# PR against the `en` branch, mirroring oracle-watch.yml.
# Source of truth + routing: utils/sync-contracts.mjs + utils/contract-page-map.json.
# The engine is fail-closed: it only writes a page when every intended edit applies
# cleanly, and reports anything ambiguous instead of guessing.
#
# NOTE: scheduled (cron) workflows only run from the repo DEFAULT branch (main),
# which is why this file lives on main even though the docs live on en.
#
# Runs weekly (cron) + on manual dispatch. NOTION_TOKEN's integration must be
# shared with every contract source page (the SOURCES map in
# utils/sync-contracts.mjs lists them all), or that page's contracts can't be read.
#
# REQUIRED SECRET: NOTION_TOKEN (same integration the oracle sync uses).

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'   # every Monday 07:23 UTC (after audit 06:23 / oracle 06:43)

concurrency:
  group: contracts-watch
  cancel-in-progress: false

# Nothing here uses GITHUB_TOKEN: checkout and push use BOT_TOKEN, `gh` uses
# GH_TOKEN. Declared anyway so the job never inherits a wider repo/org default.
permissions:
  contents: read

jobs:
  sync-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require BOT_TOKEN
        # Checked before anything else: the old guard sat inside the commit step,
        # so a week with no changes stayed green and hid the misconfiguration.
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::BOT_TOKEN is required: this workflow opens a PR against en."; exit 1; }

      - name: Checkout en branch
        uses: actions/checkout@v4
        with:
          ref: en
          fetch-depth: 0
          # BOT_TOKEN, not GITHUB_TOKEN: the same token pushes the bot branch
          # and opens the PR, and "Allow GitHub Actions to create and approve
          # pull requests" is off on this repo.
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync contract addresses from Notion
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node utils/sync-contracts.mjs

      - name: Open PR against en
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-seed the map from the just-edited pages so newly-inserted contracts
          # are tracked next run (otherwise they'd be re-detected as "new").
          node utils/gen-contract-map.mjs
          git add for-developer/ utils/contract-page-map.json
          git commit -m "chore(contracts): sync contract addresses from Notion

          ${{ steps.sync.outputs.changed }} address change(s), ${{ steps.sync.outputs.added }} new contract(s).
          Auto-detected by the Contract Address Watch workflow."
          # One stable branch per watcher: a re-run overwrites its own earlier
          # attempt instead of colliding with it, and an unmerged PR is updated
          # rather than duplicated. The branch is rebuilt from `en` every run and
          # only this workflow writes it. Nothing committed onto it by hand
          # survives the next sync.
          branch="bot/contract-sync"
          # The run recomputes against `en`, and an open PR's changes are not on
          # `en` yet, so every week rebuilds the same tree. Re-pushing it would
          # dismiss the PR's approvals (dismiss_stale_reviews_on_push) and erase
          # a reviewer's fixups while adding nothing.
          if git fetch --quiet origin "$branch" 2>/dev/null &&
             [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse FETCH_HEAD^{tree})" ]; then
            echo "$branch already holds this exact tree; leaving the open PR alone."
          else
            git push --force origin "HEAD:$branch"
          fi
          # Assigned on its own line so `bash -e` aborts when the lookup fails.
          # Inside `if [ "$(...)" = "0" ]` a gh outage reads as "a PR is already
          # open" and the run goes green having published nothing.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base en --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base en --head "$branch" \
              --title "chore(contracts): sync contract addresses from Notion" \
              --body "Opened by the ${{ github.workflow }} workflow. Details in the [run summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). This PR is only refreshed on runs that find a change, so check the table against the Notion source before merging an old one."
          else
            echo "PR for $branch is already open; force-pushed the latest sync onto it."
          fi

      - name: Job summary
        if: always()
        run: cat contract-sync-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No changes / no summary produced." >> "$GITHUB_STEP_SUMMARY"
