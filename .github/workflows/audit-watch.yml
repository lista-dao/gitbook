name: Audit Reports Watch

# Weekly check for new third-party audit PDFs in Lista's contract repos.
# When new reports are found, they are appended to security/audit-reports.md and
# committed directly to the `en` branch (fully automatic — the Feature column is
# auto-guessed from the filename).
#
# NOTE: scheduled (cron) workflows only run from the repository's DEFAULT branch
# (main), which is why this file lives on main even though the docs live on en.

on:
  schedule:
    - cron: '23 6 * * 1' # every Monday 06:23 UTC (offset off the hour to avoid GitHub cron drops)
  workflow_dispatch: # allow manual runs

concurrency:
  group: audit-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require BOT_TOKEN
        # Checked before anything else: the old guard sat inside the commit step,
        # so a week with no changes stayed green and hid the misconfiguration.
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::BOT_TOKEN is required: this workflow opens a PR against en."; exit 1; }

      - name: Checkout en branch
        uses: actions/checkout@v4
        with:
          ref: en
          fetch-depth: 0
          # BOT_TOKEN, not GITHUB_TOKEN: the same token pushes the bot branch
          # and opens the PR, and "Allow GitHub Actions to create and approve
          # pull requests" is off on this repo.
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Scan contract repos for new audit reports
        id: scan
        env:
          # Optional PAT for higher rate limits / private repos; falls back to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: node utils/check-audit-updates.mjs

      - name: Open PR against en
        if: steps.scan.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/audit-reports.md
          git commit -m "chore(audits): add ${{ steps.scan.outputs.count }} new audit report(s)

          Auto-detected by the Audit Reports Watch workflow."
          # One stable branch per watcher. A re-run force-pushes the fresh
          # commit instead of colliding with its own earlier attempt, and an
          # unmerged PR gets updated rather than duplicated. Only this
          # workflow ever writes this ref.
          branch="bot/audit-sync"
          # The branch is bot-owned and rewritten every run. Refuse to force-push
          # over a commit this workflow did not make, instead of discarding it.
          # `--exit-code` distinguishes absent (2) from failed (anything else), and
          # the status is captured off the assignment rather than inside a test, where
          # `bash -e` would not see it and a flaky remote would skip the check.
          rc=0
          lsr=$(git ls-remote --exit-code origin "refs/heads/$branch") || rc=$?
          case "$rc" in
            0) tip=$(printf '%s\n' "$lsr" | cut -f1) ;;
            2) tip="" ;;
            *) echo "::error::could not read refs/heads/$branch (git exit $rc)"; exit 1 ;;
          esac
          if [ -n "$tip" ]; then
            git fetch --quiet origin "$branch"
            if [ "$(git log -1 --format='%ae' FETCH_HEAD)" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              echo "::error::$branch carries a commit this workflow did not make. Merge or close its PR first."
              exit 1
            fi
          fi
          git push --force origin "HEAD:$branch"
          # Assigned on its own line so `bash -e` aborts when the lookup fails.
          # Inside `if [ "$(...)" = "0" ]` a gh outage reads as "a PR is already
          # open" and the run goes green having published nothing.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base en --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base en --head "$branch" \
              --title "chore(audits): add new audit report(s)" \
              --body "Opened by the ${{ github.workflow }} workflow. Details in the [run summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). This PR is only refreshed on runs that find a change, so check the table against the Notion source before merging an old one."
          else
            echo "PR for $branch is already open; force-pushed the latest sync onto it."
          fi

      - name: Job summary
        if: always()
        run: cat audit-sync-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Scan did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
