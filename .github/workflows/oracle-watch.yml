name: Multi-Oracle Watch

# Weekly sync of the Resilient Oracle config tables against the canonical Notion
# source ("Multi-Oracle For GitBook"). When the oracle config changes, the tables
# are refreshed and committed directly to the `en` branch (auto-commit).
#
# The script writes more than one page (the BNB table is partitioned into
# for-developer/multi-oracle.md and for-developer/multi-oracle-bstock.md), so the
# commit step stages the whole for-developer/ tree rather than a hardcoded
# filename.
#
# It is deliberately NOT keyed to the script's changed_files output: this file
# lives on `main` and the script lives on `en`, and the two merge independently.
# A path-scoped `git add -A` is correct under either merge order — with the old
# two-section script (nothing extra to stage) and with the new one (bStock page
# staged too). Keying it to changed_files would mean that whichever branch landed
# first silently broke the sync: docs-first would discard the bStock page from
# the auto-commit, workflow-first would fail on an empty pathspec.
# The scope stays for-developer/ so oracle-sync-summary.md is never committed.
#
# NOTE: scheduled (cron) workflows only run from the repository's DEFAULT branch
# (main), which is why this file lives on main even though the docs live on en.
#
# REQUIRED SECRET: NOTION_TOKEN — a Notion internal-integration token whose
# integration has been shared with the "Multi-Oracle For GitBook" page.

on:
  schedule:
    - cron: '43 6 * * 1' # every Monday 06:43 UTC (after audit-watch at 06:23)
  workflow_dispatch: # allow manual runs (recommended for the first run)
    inputs:
      dry_run:
        description: 'Compute and print the sync summary without writing/committing'
        type: boolean
        default: false
      allow_bulk_removal:
        description: 'Override the mass-removal guard (confirm a real delist or a wholesale bStock relocation first)'
        type: boolean
        default: false
      allow_reclassify:
        description: 'Override the cross-page reclassification guard (confirm the (bStock) suffix change in Notion first)'
        type: boolean
        default: false

concurrency:
  group: oracle-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require BOT_TOKEN
        # Checked before anything else: the old guard sat inside the commit step,
        # so a week with no changes stayed green and hid the misconfiguration.
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::BOT_TOKEN is required: this workflow opens a PR against en."; exit 1; }

      - name: Checkout en branch
        uses: actions/checkout@v4
        with:
          ref: en
          fetch-depth: 0
          # BOT_TOKEN, not GITHUB_TOKEN: the same token pushes the bot branch
          # and opens the PR, and "Allow GitHub Actions to create and approve
          # pull requests" is off on this repo.
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Multi-Oracle table from Notion
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Empty on scheduled runs (inputs is null) -> '0', so the guards stay armed
          # and scheduled behaviour is unchanged. Operators set these on manual runs.
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ORACLE_ALLOW_BULK_REMOVAL: ${{ inputs.allow_bulk_removal && '1' || '0' }}
          ORACLE_ALLOW_RECLASSIFY: ${{ inputs.allow_reclassify && '1' || '0' }}
        run: node utils/sync-multi-oracle.mjs

      - name: Open PR against en
        # has_changes is emitted even under DRY_RUN (docs are computed but not written),
        # so also skip the commit when this is a dry run.
        if: steps.sync.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANGED_FILES: ${{ steps.sync.outputs.changed_files }}
          VALUE_CHANGES: ${{ steps.sync.outputs.value_changes }}
          ADDED: ${{ steps.sync.outputs.added }}
        run: |
          set -euo pipefail
          # Stage exactly the oracle pages, nothing else. Two constraints meet here:
          #
          #  - This workflow lives on main while the sync script lives on en, so the
          #    two merge independently. An older script emits no changed_files, and
          #    `git add --` with an empty pathspec stages nothing, then the commit
          #    fails and the weekly sync stops silently. Hence the fallback to the
          #    single page the old script maintained.
          #  - `git add -A -- for-developer/` would be safe against that, but it
          #    sweeps the ~50 other files under that directory into an unattended
          #    auto-push. Allowlist the paths instead, and fail loudly on anything
          #    unexpected rather than committing it.
          files="${CHANGED_FILES:-}"
          [ -n "$files" ] || files="for-developer/multi-oracle-standard.md"
          # Allowlist covers BOTH the current layout (standard + bstock pages) and
          # the pre-restructure page (multi-oracle.md), so the weekly sync survives
          # whichever merge order the workflow (main) and the script (en) land in.
          # The hub multi-oracle.md is never written by the current script; it stays
          # here only so an older script's output is tolerated, not rejected.
          for f in $files; do
            case "$f" in
              for-developer/multi-oracle.md|for-developer/multi-oracle-standard.md|for-developer/multi-oracle-bstock.md) ;;
              *) echo "::error::sync reported unexpected path '$f' — refusing to commit."; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $files
          git commit -m "chore(oracle): sync Multi-Oracle table from Notion

          ${VALUE_CHANGES} oracle address change(s), ${ADDED} new collateral(s).
          Auto-detected by the Multi-Oracle Watch workflow."
          # One stable branch per watcher. A re-run force-pushes the fresh
          # commit instead of colliding with its own earlier attempt, and an
          # unmerged PR gets updated rather than duplicated. Only this
          # workflow ever writes this ref.
          branch="bot/oracle-sync"
          # The branch is bot-owned and rewritten every run. Refuse to force-push
          # over a commit this workflow did not make, instead of discarding it.
          if [ -n "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" ]; then
            git fetch --quiet origin "$branch"
            if [ "$(git log -1 --format='%ae' FETCH_HEAD)" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              echo "::error::$branch carries a commit this workflow did not make. Merge or close its PR first."
              exit 1
            fi
          fi
          git push --force origin "HEAD:$branch"
          # Assigned on its own line so `bash -e` aborts when the lookup fails.
          # Inside `if [ "$(...)" = "0" ]` a gh outage reads as "a PR is already
          # open" and the run goes green having published nothing.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base en --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base en --head "$branch" \
              --title "chore(oracle): sync Multi-Oracle table from Notion" \
              --body "Opened by the ${{ github.workflow }} workflow. Details in the [run summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          else
            echo "PR for $branch is already open; force-pushed the latest sync onto it."
          fi

      - name: Job summary
        if: always()
        run: cat oracle-sync-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Sync did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
