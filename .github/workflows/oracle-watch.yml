name: Multi-Oracle Watch

# Weekly sync of the Resilient Oracle config tables against the canonical Notion
# source ("Multi-Oracle For GitBook"). When the oracle config changes, the tables
# are refreshed and committed directly to the `en` branch (auto-commit).
#
# The script writes more than one page (the BNB table is partitioned into
# for-developer/multi-oracle.md and for-developer/multi-oracle-bstock.md), so the
# commit step stages the whole for-developer/ tree rather than a hardcoded
# filename.
#
# It is deliberately NOT keyed to the script's changed_files output: this file
# lives on `main` and the script lives on `en`, and the two merge independently.
# A path-scoped `git add -A` is correct under either merge order — with the old
# two-section script (nothing extra to stage) and with the new one (bStock page
# staged too). Keying it to changed_files would mean that whichever branch landed
# first silently broke the sync: docs-first would discard the bStock page from
# the auto-commit, workflow-first would fail on an empty pathspec.
# The scope stays for-developer/ so oracle-sync-summary.md is never committed.
#
# NOTE: scheduled (cron) workflows only run from the repository's DEFAULT branch
# (main), which is why this file lives on main even though the docs live on en.
#
# REQUIRED SECRET: NOTION_TOKEN — a Notion internal-integration token whose
# integration has been shared with the "Multi-Oracle For GitBook" page.

on:
  schedule:
    - cron: '30 6 * * 1' # every Monday 06:30 UTC (after audit-watch at 06:00)
  workflow_dispatch: # allow manual runs (recommended for the first run)

concurrency:
  group: oracle-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout en branch
        uses: actions/checkout@v4
        with:
          ref: en
          fetch-depth: 0
          # A PAT here lets the push to `en` trigger the downstream sync workflow
          # (en -> RAG). With the default GITHUB_TOKEN, en is still updated but the
          # RAG sync only runs on the next manual/other push to en.
          token: ${{ secrets.AUDIT_SCAN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync Multi-Oracle table from Notion
        id: sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node utils/sync-multi-oracle.mjs

      - name: Commit changes to en
        if: steps.sync.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.sync.outputs.changed_files }}
          VALUE_CHANGES: ${{ steps.sync.outputs.value_changes }}
          ADDED: ${{ steps.sync.outputs.added }}
        run: |
          set -euo pipefail
          # Stage exactly the oracle pages, nothing else. Two constraints meet here:
          #
          #  - This workflow lives on main while the sync script lives on en, so the
          #    two merge independently. An older script emits no changed_files, and
          #    `git add --` with an empty pathspec stages nothing, then the commit
          #    fails and the weekly sync stops silently. Hence the fallback to the
          #    single page the old script maintained.
          #  - `git add -A -- for-developer/` would be safe against that, but it
          #    sweeps the ~50 other files under that directory into an unattended
          #    auto-push. Allowlist the paths instead, and fail loudly on anything
          #    unexpected rather than committing it.
          files="${CHANGED_FILES:-}"
          [ -n "$files" ] || files="for-developer/multi-oracle.md"
          for f in $files; do
            case "$f" in
              for-developer/multi-oracle.md|for-developer/multi-oracle-bstock.md) ;;
              *) echo "::error::sync reported unexpected path '$f' — refusing to commit."; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $files
          git commit -m "chore(oracle): sync Multi-Oracle table from Notion

          ${VALUE_CHANGES} oracle address change(s), ${ADDED} new collateral(s).
          Auto-detected by the Multi-Oracle Watch workflow."
          git push origin HEAD:en

      - name: Job summary
        if: always()
        run: cat oracle-sync-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Sync did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
